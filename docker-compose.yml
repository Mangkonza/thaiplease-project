services:
  postgres:
    image: postgres:16-alpine
    container_name: thaiplease_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thaiplease_user
      POSTGRES_PASSWORD: thaiplease_password123
      POSTGRES_DB: thaiplease_db
      TZ: Asia/Bangkok
    ports:
      # ใช้ 5433 บนเครื่อง Host เพื่อไม่ให้ชนกับ PostgreSQL ที่ติดตั้งบนเครื่อง
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./docker/postgres/02_policy_copay.sql:/docker-entrypoint-initdb.d/02_policy_copay.sql
      - ./docker/postgres/03_coupons.sql:/docker-entrypoint-initdb.d/03_coupons.sql
      - ./docker/postgres/04_cases.sql:/docker-entrypoint-initdb.d/04_cases.sql
      - ./docker/postgres/05_missions.sql:/docker-entrypoint-initdb.d/05_missions.sql
      - ./docker/postgres/06_budget_approvals.sql:/docker-entrypoint-initdb.d/06_budget_approvals.sql
      # ข้อมูล demo ใส่ครั้งแรกที่สร้าง volume เท่านั้น (ดู backend/seed/README.md)
      - ./backend/seed/seed.sql:/docker-entrypoint-initdb.d/07_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thaiplease_user -d thaiplease_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: thaiplease_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@thaiplease.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # frontend + backend ใน container เดียว เปิดหน้าเว็บและ API ที่ http://localhost:8080
  app:
    build: .
    container_name: thaiplease_app
    restart: unless-stopped
    # ค่า AI_* (key ของแต่ละคน) อ่านจาก backend/.env ถ้ามี ไม่มีก็รันได้ แต่สร้างรายงาน AI ไม่ได้
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: thaiplease_user
      DB_PASSWORD: thaiplease_password123
      DB_NAME: thaiplease_db
      # ใช้ในเครื่องเท่านั้น ถ้าจะเปิดให้คนอื่นใช้ ให้ตั้ง JWT_SECRET ใน shell หรือไฟล์ .env ข้าง docker-compose.yml
      JWT_SECRET: ${JWT_SECRET:-thaiplease-local-docker-only}
      TZ: Asia/Bangkok
    ports:
      - "8080:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data: